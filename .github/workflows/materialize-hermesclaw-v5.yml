name: Verify and materialize HermesClaw baseline v5

on:
  push:
    branches:
      - main
      - agent/materialize-baseline-v5
      - agent/fix-materialization-index
      - agent/fix-workflow-permission-materialization
    paths:
      - bootstrap/v5/**
      - .github/workflows/materialize-hermesclaw-v5.yml
  pull_request:
    branches:
      - main
    paths:
      - bootstrap/v5/**
      - .github/workflows/materialize-hermesclaw-v5.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermesclaw-baseline-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify payload fragments
        shell: bash
        run: |
          set -euo pipefail
          cd bootstrap/v5
          sha256sum --check CHUNKS.sha256
          mapfile -t chunks < <(find . -maxdepth 1 -type f -name 'baseline-v5-*.b64' -print | sort)
          test "${#chunks[@]}" -eq 14
          total_size="$(cat "${chunks[@]}" | wc -c)"
          test "$total_size" -eq 151072
          cat "${chunks[@]}" > /tmp/hermesclaw-baseline.b64

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/hermesclaw-baseline.b64 > /tmp/hermesclaw-baseline.tar.xz
          (cd /tmp && sha256sum --check "$GITHUB_WORKSPACE/bootstrap/v5/BASELINE.sha256")
          xz --test /tmp/hermesclaw-baseline.tar.xz
          mkdir -p /tmp/hermesclaw-root
          tar -xJf /tmp/hermesclaw-baseline.tar.xz --strip-components=1 -C /tmp/hermesclaw-root
          test "$(find /tmp/hermesclaw-root -type f | wc -l)" -eq 85
          (cd /tmp/hermesclaw-root && sha256sum --check "$GITHUB_WORKSPACE/bootstrap/FINAL_FILE_MANIFEST.sha256")
          test "$(cat "$GITHUB_WORKSPACE/bootstrap/EXPECTED_LOCAL_COMMIT")" = "d79d2ebb3c7a0092f833d5883f1522954566e031"
          python3 /tmp/hermesclaw-root/source/raglite/validate_source.py

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Configure Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install Tauri system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rsync \
            xz-utils

      - name: Verify Rust proof gates
        working-directory: /tmp/hermesclaw-root
        run: |
          cargo fmt --all --check
          cargo test --workspace --exclude hermesclaw-desktop --locked
          cargo clippy --workspace --exclude hermesclaw-desktop --all-targets --locked -- -D warnings

      - name: Verify web proof gates
        working-directory: /tmp/hermesclaw-root
        run: |
          npm --prefix apps/web ci
          npm run test:web
          npm run lint:web
          npm run build:web

      - name: Verify Tauri desktop compile gate
        working-directory: /tmp/hermesclaw-root
        run: cargo check -p hermesclaw-desktop --locked

      - name: Stage verified non-workflow source on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('bootstrap/v5/READY') != ''
        shell: bash
        env:
          GIT_INDEX_FILE: /tmp/hermesclaw-materialize.index
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          expected_local_commit="$(cat bootstrap/EXPECTED_LOCAL_COMMIT)"
          manifest="$GITHUB_WORKSPACE/bootstrap/FINAL_FILE_MANIFEST.sha256"

          git config user.name "HermesClaw Baseline Bot"
          git config user.email "actions@users.noreply.github.com"

          rm -f "$GIT_INDEX_FILE"
          git read-tree "$GITHUB_SHA^{tree}"

          manifest_entries="$(wc -l < "$manifest" | tr -d ' ')"
          test "$manifest_entries" -eq 85
          staged_entries=0

          while read -r expected_hash relative_path; do
            test -n "$expected_hash"
            test -n "$relative_path"
            file="/tmp/hermesclaw-root/$relative_path"
            test -f "$file"
            actual_hash="$(sha256sum "$file" | cut -d' ' -f1)"
            test "$actual_hash" = "$expected_hash"

            if [[ "$relative_path" == ".github/workflows/ci.yml" ]]; then
              continue
            fi

            blob_sha="$(git hash-object -w -- "$file")"
            git update-index --add --cacheinfo 100644 "$blob_sha" "$relative_path"
            staged_entries=$((staged_entries + 1))
          done < "$manifest"

          test "$staged_entries" -eq 84
          published_tree="$(git write-tree)"
          published_paths="$(git ls-tree -r --name-only "$published_tree")"

          grep -qx 'source/00_PROJECT_CONSTITUTION.md' <<< "$published_paths"
          grep -qx 'crates/hc-agent/src/lib.rs' <<< "$published_paths"
          grep -qx 'apps/web/src/App.tsx' <<< "$published_paths"
          grep -qx 'bootstrap/v5/READY' <<< "$published_paths"
          if grep -qx '.github/workflows/ci.yml' <<< "$published_paths"; then
            echo 'canonical CI workflow must be installed by the GitHub integration' >&2
            exit 1
          fi

          published_commit="$({
            printf '%s\n\n' "chore: stage verified HermesClaw source ${expected_local_commit:0:12}"
            printf 'Source baseline: %s\n' "$expected_local_commit"
            printf 'The canonical CI workflow is installed separately by the GitHub integration.\n'
          } | git commit-tree "$published_tree" -p "$GITHUB_SHA")"

          timeout 120 git push origin "${published_commit}:refs/heads/main"
