name: Verify workspace.write model patch

on:
  push:
    branches:
      - agent/workspace-write-design
    paths:
      - bootstrap/workspace-write-models/VERIFY

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Reconstruct and inspect patch
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/workspace-write-models/patch-*.b64 \
            | base64 --decode \
            | xz --decompress \
            > /tmp/workspace-write-models.patch
          sha256sum /tmp/workspace-write-models.patch | tee /tmp/workspace-write-models.patch.sha256
          git apply --check /tmp/workspace-write-models.patch
          git apply --numstat /tmp/workspace-write-models.patch | tee /tmp/workspace-write-models.patch.numstat

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: workspace-write-model-patch
          path: |
            /tmp/workspace-write-models.patch
            /tmp/workspace-write-models.patch.sha256
            /tmp/workspace-write-models.patch.numstat
          if-no-files-found: error
          retention-days: 1
