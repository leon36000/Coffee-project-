name: Resolve workspace.write dependencies

on:
  push:
    branches:
      - agent/workspace-write-design
    paths:
      - bootstrap/workspace-write-deps/**

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Resolve and verify policy dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p hc-policy
          cargo clippy -p hc-policy --all-targets -- -D warnings

      - name: Export newly resolved crates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hermesclaw-vendor /tmp/workspace-write-deps
          cargo vendor /tmp/hermesclaw-vendor >/tmp/vendor-config.toml
          mkdir -p /tmp/workspace-write-deps
          cp Cargo.lock /tmp/workspace-write-deps/Cargo.lock

          for crate in serde_jcs ryu-js; do
            source_dir="$(find /tmp/hermesclaw-vendor -mindepth 1 -maxdepth 1 -type d -name "${crate}*" -print -quit)"
            test -n "$source_dir"
            echo "exporting $source_dir"
            cp -a "$source_dir" /tmp/workspace-write-deps/
          done

          tar -C /tmp -cJf /tmp/workspace-write-deps.tar.xz workspace-write-deps
          sha256sum /tmp/workspace-write-deps.tar.xz > /tmp/workspace-write-deps.tar.xz.sha256

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'HermesClaw Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: lock workspace write policy dependencies'
          git push origin HEAD:agent/workspace-write-design

      - name: Upload local vendor delta
        uses: actions/upload-artifact@v4
        with:
          name: workspace-write-policy-dependencies
          path: |
            /tmp/workspace-write-deps.tar.xz
            /tmp/workspace-write-deps.tar.xz.sha256
          if-no-files-found: error
          retention-days: 1
