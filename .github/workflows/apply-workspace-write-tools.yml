name: Apply workspace.write tools patch

on:
  push:
    branches:
      - agent/workspace-write-design
    paths:
      - bootstrap/workspace-write-tools/READY

permissions:
  contents: write

concurrency:
  group: apply-workspace-write-tools
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/workspace-write-tools/patch-*.b64 \
            | base64 --decode \
            | xz --decompress \
            > /tmp/workspace-write-tools.patch
          echo '19e0b3bf376c36f747ec21d67668399a6763fa458b2a4960cbe81d92ff7d7b16  /tmp/workspace-write-tools.patch' \
            | sha256sum --check
          git apply --check --index /tmp/workspace-write-tools.patch

      - name: Apply patch and verify Rust gates
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/workspace-write-tools.patch
          cargo fmt --all --check
          cargo test --workspace --exclude hermesclaw-desktop --locked
          cargo clippy --workspace --exclude hermesclaw-desktop --all-targets --locked -- -D warnings
          git diff --cached --check

      - name: Commit verified tools implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HermesClaw Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(tools): create workspace files without overwrite'
          git push origin HEAD:agent/workspace-write-design
