name: Materialize workspace.write implementation plan

on:
  push:
    branches:
      - agent/workspace-write-design
    paths:
      - bootstrap/workspace-write-plan/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, decode, and verify plan
        shell: bash
        run: |
          set -euo pipefail
          cd bootstrap/workspace-write-plan/chunks
          echo 'd6f0668b5e6d2e0f27d38e6aac7992dcb1bdf025c3786f6a4d32bedad311a729  000a.b64' | sha256sum --check
          echo 'd1f2fd50ef6a8f7af905e4647be846d91d54caa141433a3330eda985bb4e192d  000b.b64' | sha256sum --check
          echo '8fc6cc5b7609af07eeafb3b1d5560f084efe9d72932bb55756fa6ed51123bafa  000c.b64' | sha256sum --check
          echo '873a4d5f4e17ee6ff02c026fb34a4afa4848cfa9b4b5dbd7ed09a4533d115bad  000d.b64' | sha256sum --check
          echo 'f1e1d527509ef76c72c3ebc3679f545000cb73f91bcbfe8714b424b26a70a130  001.b64' | sha256sum --check
          echo 'd67fc22eef045cde785631607b5a22839ab3da25046dfbd9b4db973c51d2e0c2  002.b64' | sha256sum --check
          echo '8e8257e0501830adfb414e6882594fea4f8f09769e77c170cd3f7180bd51957b  003.b64' | sha256sum --check
          echo 'a65f201e3ca253c9b6ccf45599597a4749dac0e8c47c2f9574f328b1684def56  004.b64' | sha256sum --check
          echo '480026df22e6e072baf0348cc15dbdb2333d46659fa915e59ab76684918deffb  005.b64' | sha256sum --check
          echo 'ac95987cd73cfa1ccf52cf68c32a1e6c7dc5e75b4c02f2fdf0b94c5173f11ab7  006.b64' | sha256sum --check
          echo '0677a681ee88f91625bf46bad14ae04981888b72793d92a3ff4e0227d2e482b6  007.b64' | sha256sum --check
          cat 000a.b64 000b.b64 000c.b64 000d.b64 001.b64 002.b64 003.b64 004.b64 005.b64 006.b64 007.b64 > /tmp/workspace-write-plan.b64
          cd "$GITHUB_WORKSPACE"
          test "$(wc -c < /tmp/workspace-write-plan.b64)" -eq 29520
          echo '46c14646fc7faf490e6cc8b456dfd4c5720a24763d954b4ae35d19de485578c4  /tmp/workspace-write-plan.b64' | sha256sum --check
          base64 --decode /tmp/workspace-write-plan.b64 > /tmp/workspace-write-plan.md.xz
          echo '0e87c9454913848ba7bc8c812578c62f617cf4c8a8e7e49b9fb00197876a2be0  /tmp/workspace-write-plan.md.xz' | sha256sum --check
          xz --test /tmp/workspace-write-plan.md.xz
          mkdir -p docs/superpowers/plans
          xz --decompress --stdout /tmp/workspace-write-plan.md.xz > docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md
          echo '9bbf843c4f5ed9a7a12dd28bde1c51bb059b99bb412b8dc34dd5d996c7940560  docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md' | sha256sum --check
          test "$(grep -c '^### Task ' docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md)" -eq 12
          ! grep -Eq 'TBD|TODO|implement later|fill in details|Similar to Task|/\*' docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md
          git diff --check

      - name: Commit verified plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HermesClaw Planning Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md
          git commit -m 'docs: plan durable workspace write implementation'
          git push origin HEAD:agent/workspace-write-design
