name: Materialize workspace.write implementation plan

on:
  push:
    branches:
      - agent/workspace-write-design
    paths:
      - bootstrap/workspace-write-plan/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify plan
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/workspace-write-plan/plan.xz.b64 > /tmp/workspace-write-plan.md.xz
          echo '0e87c9454913848ba7bc8c812578c62f617cf4c8a8e7e49b9fb00197876a2be0  /tmp/workspace-write-plan.md.xz' | sha256sum --check
          xz --test /tmp/workspace-write-plan.md.xz
          mkdir -p docs/superpowers/plans
          xz --decompress --stdout /tmp/workspace-write-plan.md.xz > docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md
          echo '9bbf843c4f5ed9a7a12dd28bde1c51bb059b99bb412b8dc34dd5d996c7940560  docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md' | sha256sum --check
          test "$(grep -c '^### Task ' docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md)" -eq 12
          ! grep -Eq 'TBD|TODO|implement later|fill in details|Similar to Task|/\*' docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md
          git diff --check

      - name: Commit verified plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HermesClaw Planning Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/superpowers/plans/2026-08-14-workspace-write-approval-implementation.md
          git commit -m 'docs: plan durable workspace write implementation'
          git push origin HEAD:agent/workspace-write-design
