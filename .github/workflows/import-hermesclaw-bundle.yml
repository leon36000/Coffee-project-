name: Import verified HermesClaw Git bundle

on:
  push:
    branches:
      - main
    paths:
      - bootstrap/READY

permissions:
  contents: write

concurrency:
  group: hermesclaw-official-bundle-import
  cancel-in-progress: false

jobs:
  verify-and-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout bootstrap head with push credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Reconstruct and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chunks < <(find bootstrap -maxdepth 1 -type f -name 'bundle-*.b64' | sort)
          test "${#chunks[@]}" -eq "$(cat bootstrap/EXPECTED_CHUNK_COUNT)"
          cat "${chunks[@]}" > /tmp/hermesclaw.bundle.b64
          base64 --decode /tmp/hermesclaw.bundle.b64 > /tmp/HermesClaw-official-baseline.bundle
          cp bootstrap/BUNDLE_SHA256SUMS /tmp/BUNDLE_SHA256SUMS
          (cd /tmp && sha256sum --check BUNDLE_SHA256SUMS)
          git bundle verify /tmp/HermesClaw-official-baseline.bundle
          expected_commit="$(cat bootstrap/EXPECTED_BUNDLE_COMMIT)"
          expected_ref="$(cat bootstrap/EXPECTED_BUNDLE_REF)"
          actual_commit="$(git bundle list-heads /tmp/HermesClaw-official-baseline.bundle | awk -v ref="$expected_ref" '$2 == ref { print $1 }')"
          test -n "$actual_commit"
          test "$actual_commit" = "$expected_commit"
          git fetch /tmp/HermesClaw-official-baseline.bundle "$expected_ref:refs/remotes/bundle/main"
          test "$(git rev-parse refs/remotes/bundle/main)" = "$expected_commit"
          git worktree add --detach /tmp/hermesclaw-source refs/remotes/bundle/main

      - name: Validate canonical source
        working-directory: /tmp/hermesclaw-source
        run: python3 source/raglite/validate_source.py

      - name: Verify Rust proof gates
        working-directory: /tmp/hermesclaw-source
        run: |
          cargo fmt --all --check
          cargo test --workspace --exclude hermesclaw-desktop --locked
          cargo clippy --workspace --exclude hermesclaw-desktop --all-targets --locked -- -D warnings

      - name: Verify web proof gates
        working-directory: /tmp/hermesclaw-source
        run: |
          npm --prefix apps/web ci
          npm run test:web
          npm run lint:web
          npm run build:web

      - name: Verify Tauri desktop compile gate
        working-directory: /tmp/hermesclaw-source
        run: cargo check -p hermesclaw-desktop --locked

      - name: Replace bootstrap history using explicit lease
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="$(cat bootstrap/EXPECTED_BUNDLE_COMMIT)"
          test "$(git rev-parse refs/remotes/bundle/main)" = "$expected_commit"
          git push \
            --force-with-lease="refs/heads/main:${GITHUB_SHA}" \
            origin \
            refs/remotes/bundle/main:refs/heads/main
