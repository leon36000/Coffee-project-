name: HermesClaw CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust proof gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --workspace --exclude hermesclaw-desktop --locked
      - name: Clippy
        run: cargo clippy --workspace --exclude hermesclaw-desktop --all-targets --locked -- -D warnings

  web:
    name: Web proof gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Test cockpit
        run: npm run test:web
      - name: Build cockpit
        run: npm run build:web

  desktop:
    name: Tauri desktop compile gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Compile desktop shell
        run: cargo check -p hermesclaw-desktop --locked
