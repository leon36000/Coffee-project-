name: Export bootstrap payload

on:
  push:
    branches:
      - main
    paths:
      - bootstrap/EXPORT_PAYLOAD

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload bootstrap payload
        uses: actions/upload-artifact@v4
        with:
          name: hermesclaw-bootstrap-payload
          path: |
            bootstrap/xz-*.b64
            bootstrap/overlay-*.b64
            bootstrap/part-*.b64
            bootstrap/*SHA256SUMS
            bootstrap/EXPECTED_*
            bootstrap/FINAL_FILE_MANIFEST.sha256
          if-no-files-found: error
          retention-days: 1
