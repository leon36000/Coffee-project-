[workspace]
members = [
  "crates/hc-domain",
  "crates/hc-policy",
  "crates/hc-mission",
  "crates/hc-state",
  "crates/hc-tools",
  "crates/hc-models",
  "crates/hc-agent",
  "crates/hc-api",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "tokio"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
http-body-util = "0.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2"
tauri-build = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v7"] }
